services:
  target:
    build:
      context: ../target
    container_name: local-security-target-hardened
    ports:
      - "127.0.0.1:18081:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    networks:
      - security_lab_hardened

networks:
  security_lab_hardened:
    driver: bridge
    internal: true
