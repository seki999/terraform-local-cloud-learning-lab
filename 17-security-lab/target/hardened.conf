server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Hardened state: the sensitive path is no longer remotely readable.
    location = /admin.txt {
        return 403;
    }
}
