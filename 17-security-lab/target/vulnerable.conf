server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Intentionally exposed for this local-only lab.
    location = /admin.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }
}
